name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  bot:
    name: Bot sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Syntax-check every source file
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Run sanity checks (db schema + command definitions load)
        run: npm run verify
